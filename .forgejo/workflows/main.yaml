---
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  all:
    runs-on: 'self-hosted'
    steps:
      - uses: 'https://git.adyxax.org/adyxax.org/action-checkout@1.1.0'
      - name: 'Bootstrap the perl library'
        run: './make.pl -h'
      - name: 'Tidy'
        run: './make.pl -n tidy --fail-if-dirty'
      - name: 'build'
        run: './make.pl -n build'
      # we need the build step done before running check because the `search`
      # server embeds the `index.html` file, which gets generated by hugo during
      # the build step.
      - name: 'Check and lint everything'
        run: |
          ./make.pl -n check
          ansible/make.pl -n check
      - name: 'deploy'
        run: './make.pl -n deploy'
        env:
          SSH_PRIVATE_KEY: '${{ secrets.SSH_PRIVATE_KEY }}'
